# GitHub Actions CI — mirrors .gitlab-ci.yml (lint → tests → builds → Terraform checks).
# No AWS credentials are used here; deployment lives in deploy-aws.yml (manual, opt-in).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventalpha_test
          POSTGRES_USER: eventalpha
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventalpha -d eventalpha_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://eventalpha:ci_only_password@localhost:5432/eventalpha_test
      DATA_MODE: demo
      SEC_USER_AGENT: EventAlpha-CI ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Unit tests
        run: pytest -q --ignore=tests/integration
      - name: Integration tests (PostgreSQL)
        run: pytest -q tests/integration

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target prod -t eventalpha-backend:${{ github.sha }} backend
      - run: docker build --target build -t eventalpha-frontend-build:${{ github.sha }} frontend

  terraform:
    name: Terraform fmt + validate (no apply)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5
      - run: terraform -chdir=infra/terraform fmt -recursive -check
      - run: |
          for env in dev prod; do
            terraform -chdir=infra/terraform/environments/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/environments/$env validate
          done
